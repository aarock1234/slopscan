# ranges in local repositories with the grade a careful reviewer would give them. run with
#   pnpm script scripts/calibrate.ts
# paths are relative to this project. expectations are proposals from a first read; correct them
# freely, then tune the constants in .slopscan.yml until the table is all hits.

ranges:
    - name: betty recent web work
      repo: ../betty
      base: HEAD~8
      head: HEAD
      expect: A-B
      note: routine feature work; a few any-typed api shapes and nested ternaries in components

    - name: camrelay recent
      repo: ../camrelay
      base: HEAD~8
      head: HEAD
      expect: A-B
      note: electron app; promise chains in the main process

    - name: autobot-go recent
      repo: ../autobot-go
      base: HEAD~8
      head: HEAD
      expect: A
      note: mature go codebase, small recent diffs

    - name: ai-sdk-go recent
      repo: ../ai-sdk-go
      base: HEAD~4
      head: HEAD
      expect: A-B

    # the two anchors from real review: 915 is a passable C in its author's eyes; 941 got a request-changes review
    # (docs/pr-941-backend-review.md in that repository) for duplicated shapes, meaning recovered from prose,
    # compute and persist behind one catch, prompts as code, and parallel arrays
    - name: cubby-law PR 915 question evidence
      repo: ../../Cubby/cubby-law
      base: 9899b048cf
      head: 6730a34c3e
      expect: B-C
      note: 27 files; unvalidated casts, magic numbers, and a prompt authored as a string array; the author rates it a C, not an A

    - name: cubby-law PR 941 rubric grading
      repo: ../../Cubby/cubby-law
      base: 5dfb6f81c79acacbf741160885123a1362d75fbe
      head: 9a499caf3ee61b93290a62b3a70ae9028e89a38e
      expect: D-F
      note: 130 files; the review requested changes on design grounds, formatting set aside

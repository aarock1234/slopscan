name: slopscan
description: Scores a pull request for slop - hacky, non-idiomatic, non-future-proof TypeScript and Go - and posts the report.
author: slopscan

branding:
    icon: alert-octagon
    color: orange

inputs:
    base:
        description: Branch to diff against. Defaults to the pull request's base branch.
        default: ''
    judge:
        description: Run the full LLM judge over whole files, the thorough and expensive tier. Needs openrouter-api-key or openai-api-key.
        default: 'false'
    typesafe-api-key:
        description: TypeSafe key for Jev, the cheap tier that judges every changed function and type. Without it, syntax rules only.
        default: ''
    openrouter-api-key:
        description: OpenRouter key for the judge, and for the verifier that checks Jev's less confident findings.
        default: ''
    openai-api-key:
        description: OpenAI key, used the same way as openrouter-api-key.
        default: ''
    comment:
        description: Post or update one sticky comment on the pull request.
        default: 'true'
    fail-on-threshold:
        description: Fail the check when the score is above failThreshold in .slopscan.yml.
        default: 'true'
    version:
        description: Version of the npm package to run.
        default: latest

outputs:
    score:
        description: Overall slop score, 0 to 100.
        value: ${{ steps.scan.outputs.score }}
    grade:
        description: Letter grade A to F.
        value: ${{ steps.scan.outputs.grade }}

runs:
    using: composite
    steps:
        # a comment-triggered run acts with the repository's secrets, so only people who could push here may ask
        - name: Check who asked
          if: github.event_name == 'issue_comment'
          shell: bash
          env:
              ASSOCIATION: ${{ github.event.comment.author_association }}
          run: |
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR) ;;
                *) echo "refusing @slopscan from $ASSOCIATION: write access required" >&2; exit 1 ;;
              esac

        - name: Acknowledge the request
          if: github.event_name == 'issue_comment'
          shell: bash
          env:
              GH_TOKEN: ${{ github.token }}
          run: |
              gh api --method POST "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
                -f content=eyes > /dev/null

        - name: Locate the pull request
          id: pr
          shell: bash
          env:
              GH_TOKEN: ${{ github.token }}
              NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
              BASE_INPUT: ${{ inputs.base }}
              BASE_REF: ${{ github.base_ref }}
          run: |
              set -euo pipefail
              base="${BASE_INPUT:-$BASE_REF}"

              if [ -n "$NUMBER" ]; then
                if [ -z "$base" ]; then
                  base=$(gh pr view "$NUMBER" --repo "${{ github.repository }}" --json baseRefName --jq .baseRefName)
                fi
                # a comment run starts on the default branch; move to the pull request's head
                if [ "${{ github.event_name }}" = "issue_comment" ]; then
                  git fetch --no-tags origin "pull/$NUMBER/head:slopscan-head"
                  git checkout -q slopscan-head
                fi
              fi

              if [ -z "$base" ]; then
                echo "no base branch: pass the base input when not running on a pull request" >&2
                exit 2
              fi

              echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
              echo "base=$base" >> "$GITHUB_OUTPUT"
              echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

        - name: Setup Node.js
          uses: actions/setup-node@v6
          with:
              node-version: 24

        - name: Restore model cache
          uses: actions/cache@v4
          with:
              path: .slopscan-cache
              key: slopscan-${{ github.repository }}-${{ steps.pr.outputs.head }}
              restore-keys: slopscan-${{ github.repository }}-

        - name: Scan
          id: scan
          shell: bash
          env:
              OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
              OPENAI_API_KEY: ${{ inputs.openai-api-key }}
              TYPESAFE_API_KEY: ${{ inputs.typesafe-api-key }}
              BASE: ${{ steps.pr.outputs.base }}
          run: |
              set -uo pipefail
              git fetch --no-tags origin "$BASE"

              judge_flag="--no-judge"
              if [ "${{ inputs.judge }}" = "true" ] && { [ -n "$OPENROUTER_API_KEY" ] || [ -n "$OPENAI_API_KEY" ]; }; then
                judge_flag="--judge"
              fi

              set +e
              npx --yes "@aarock1234/slopscan@${{ inputs.version }}" scan \
                --base "origin/$BASE" --head HEAD \
                --format markdown --json-out slopscan-report.json $judge_flag > slopscan-report.md
              status=$?
              set -e

              # exit 1 means over the threshold, but only when a report exists; anything else is a failed run
              if [ "$status" -eq 2 ] || [ ! -s slopscan-report.json ]; then
                echo "slopscan failed to run (exit $status)" >&2
                cat slopscan-report.md >&2 || true
                exit 2
              fi

              cat slopscan-report.md >> "$GITHUB_STEP_SUMMARY"
              echo "score=$(node -p "JSON.parse(require('fs').readFileSync('slopscan-report.json','utf8')).overall")" >> "$GITHUB_OUTPUT"
              echo "grade=$(node -p "JSON.parse(require('fs').readFileSync('slopscan-report.json','utf8')).grade")" >> "$GITHUB_OUTPUT"
              echo "status=$status" >> "$GITHUB_OUTPUT"

        - name: Upload report
          uses: actions/upload-artifact@v4
          with:
              name: slopscan-report
              path: slopscan-report.json

        - name: Comment on the pull request
          if: inputs.comment == 'true' && steps.pr.outputs.number != ''
          shell: bash
          env:
              GH_TOKEN: ${{ github.token }}
              PR: ${{ steps.pr.outputs.number }}
          run: |
              set -euo pipefail
              marker="<!-- slopscan -->"
              { echo "$marker"; cat slopscan-report.md; } > slopscan-comment.md

              existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
                --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id // empty")

              if [ -n "$existing" ]; then
                gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" -F body=@slopscan-comment.md > /dev/null
              else
                gh pr comment "$PR" --repo "${{ github.repository }}" --body-file slopscan-comment.md
              fi

        - name: Enforce threshold
          if: inputs.fail-on-threshold == 'true' && steps.scan.outputs.status == '1'
          shell: bash
          run: |
              echo "slop score ${{ steps.scan.outputs.score }} (${{ steps.scan.outputs.grade }}) is over the fail threshold" >&2
              exit 1
